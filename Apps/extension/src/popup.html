<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>ذِكرى</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="popup.css" />
    <script src="boot.js"></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <header class="head">
      <img class="mark" src="icons/48.png" alt="" />
      <div class="head-text">
        <strong>ذِكرى</strong>
        <div id="next" class="muted"></div>
      </div>
      <button class="btn ghost icon-btn" id="open-settings" title="إعدادات الاستماع" aria-label="إعدادات الاستماع"></button>
      <button class="btn ghost icon-btn" id="open-tab" title="افتح ذِكرى" aria-label="افتح ذِكرى"></button>
    </header>

    <section class="player" id="player" aria-live="polite"></section>

    <div class="suggest" id="suggest"></div>

    <div class="filters">
      <div class="tabs" role="tablist" id="tabs"></div>
      <input class="field" id="filter" type="search" autocomplete="off" />
    </div>

    <ul class="stations" id="stations"></ul>
  </body>
</html>
